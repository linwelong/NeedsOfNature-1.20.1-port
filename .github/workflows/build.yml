name: Build Mods
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x ./gradlew

      - name: 执行构建
        run: ./gradlew build

      - name: 上传成品模组
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mods
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
